<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Aplicación deshabilitada · Águilas KC</title>
  <!-- La App GAV se deshabilitó el 26-oct-2026: ahora vive en aguilaskc.net (pedido de Manu). Todas las páginas de
       este repositorio mandan aquí. Para volver a abrirla, restaura este archivo desde el historial y quita el aviso
       que se agregó al inicio de cada página de modulos/. -->
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
      font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:#f3f8ff;
      background:radial-gradient(circle at 50% -15%,#12365d 0%,#061321 35%,#02070f 75%)}
    .caja{width:min(460px,100%);text-align:center;padding:32px 24px;border-radius:24px;
      background:rgba(8,22,39,.92);border:1px solid rgba(104,176,255,.22);box-shadow:0 24px 70px rgba(0,0,0,.45)}
    img{width:110px;height:auto;margin-bottom:12px;filter:invert(1)}
    .kicker{font-size:11px;letter-spacing:.22em;color:#8ea6be;font-weight:700}
    h1{margin:10px 0 12px;font-size:clamp(22px,6vw,28px);line-height:1.25}
    p{margin:0 0 22px;color:#c9d6e3;font-size:17px;line-height:1.45}
    a.ir{display:inline-block;padding:15px 26px;border-radius:14px;background:#2f9bff;color:#fff;font-weight:800;
      font-size:18px;text-decoration:none;box-shadow:0 10px 26px rgba(47,155,255,.35)}
    a.ir:active{transform:scale(.98)}
  </style>
</head>
<body>
  <main class="caja">
    <img src="modulos/fuerza/logo-transparent.png" alt="Águilas KC">
    <div class="kicker">ÁGUILAS KC · GIMNASIA ARTÍSTICA VARONIL</div>
    <h1>Esta aplicación ha sido deshabilitada.</h1>
    <p>Por favor, dirígete a <b>aguilaskc.net</b>.</p>
    <a class="ir" href="https://aguilaskc.net/gav/app/">Ir a aguilaskc.net</a>
  </main>
</body>
</html>
